<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="nssBlueGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a2558" />
      <stop offset="100%" stop-color="#051433" />
    </radialGradient>
    <radialGradient id="nssRedGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e63946" />
      <stop offset="70%" stop-color="#b51a2b" />
      <stop offset="100%" stop-color="#7d0e1c" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Ring with Navy Blue -->
  <circle cx="200" cy="200" r="190" fill="url(#nssBlueGrad)" stroke="#f59e0b" stroke-width="6" />

  <!-- Outer Border Studs / Dots -->
  <g fill="#ffe082">
    <!-- 24 small ornamental dots -->
    <circle cx="200" cy="22" r="4" />
    <circle cx="245" cy="28" r="4" />
    <circle cx="288" cy="45" r="4" />
    <circle cx="325" cy="72" r="4" />
    <circle cx="355" cy="110" r="4" />
    <circle cx="372" cy="155" r="4" />
    <circle cx="378" cy="200" r="4" />
    <circle cx="372" cy="245" r="4" />
    <circle cx="355" cy="290" r="4" />
    <circle cx="325" cy="328" r="4" />
    <circle cx="288" cy="355" r="4" />
    <circle cx="245" cy="372" r="4" />
    <circle cx="200" cy="378" r="4" />
    <circle cx="155" cy="372" r="4" />
    <circle cx="112" cy="355" r="4" />
    <circle cx="75" cy="328" r="4" />
    <circle cx="45" cy="290" r="4" />
    <circle cx="28" cy="245" r="4" />
    <circle cx="22" cy="200" r="4" />
    <circle cx="28" cy="155" r="4" />
    <circle cx="45" cy="110" r="4" />
    <circle cx="75" cy="72" r="4" />
    <circle cx="112" cy="45" r="4" />
    <circle cx="155" cy="28" r="4" />
  </g>

  <!-- Circular Text Path -->
  <path id="textCircleTop" d="M 50,200 A 150,150 0 1,1 350,200" fill="none" />
  <path id="textCircleBottom" d="M 350,200 A 150,150 0 0,1 50,200" fill="none" />

  <!-- Text: NATIONAL SERVICE SCHEME -->
  <text fill="#ffffff" font-family="'Poppins', 'Arial Black', sans-serif" font-size="23" font-weight="800" letter-spacing="4.5">
    <textPath href="#textCircleTop" xlink:href="#textCircleTop" startOffset="50%" text-anchor="middle">
      NATIONAL SERVICE SCHEME
    </textPath>
  </text>
  <text fill="#ffe082" font-family="'Poppins', 'Arial Black', sans-serif" font-size="20" font-weight="700" letter-spacing="6">
    <textPath href="#textCircleBottom" xlink:href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      NOT ME BUT YOU
    </textPath>
  </text>

  <!-- Inner Concentric Circle -->
  <circle cx="200" cy="200" r="126" fill="url(#nssRedGrad)" stroke="#ffe082" stroke-width="5" />

  <!-- Konark Wheel Design -->
  <!-- Wheel Rim Inner Ring -->
  <circle cx="200" cy="200" r="112" fill="none" stroke="#ffe082" stroke-width="3" stroke-dasharray="4,4" />

  <!-- 8 Konark Sun Temple Spokes representing 24 hours of day -->
  <g stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round">
    <!-- 8 Primary Spokes -->
    <line x1="200" y1="200" x2="200" y2="88" />
    <line x1="200" y1="200" x2="279" y2="121" />
    <line x1="200" y1="200" x2="312" y2="200" />
    <line x1="200" y1="200" x2="279" y2="279" />
    <line x1="200" y1="200" x2="200" y2="312" />
    <line x1="200" y1="200" x2="121" y2="279" />
    <line x1="200" y1="200" x2="88" y2="200" />
    <line x1="200" y1="200" x2="121" y2="121" />
  </g>

  <!-- 8 Intermediate Secondary Spokes -->
  <g stroke="#ffffff" stroke-width="3.5" opacity="0.85">
    <line x1="200" y1="200" x2="243" y2="96" />
    <line x1="200" y1="200" x2="304" y2="157" />
    <line x1="200" y1="200" x2="304" y2="243" />
    <line x1="200" y1="200" x2="243" y2="304" />
    <line x1="200" y1="200" x2="157" y2="304" />
    <line x1="200" y1="200" x2="96" y2="243" />
    <line x1="200" y1="200" x2="96" y2="157" />
    <line x1="200" y1="200" x2="157" y2="96" />
  </g>

  <!-- Spoke Diamond / Medallion Ornaments -->
  <g fill="#ffe082" stroke="#0a2558" stroke-width="2">
    <circle cx="200" cy="130" r="7" />
    <circle cx="250" cy="150" r="7" />
    <circle cx="270" cy="200" r="7" />
    <circle cx="250" cy="250" r="7" />
    <circle cx="200" cy="270" r="7" />
    <circle cx="150" cy="250" r="7" />
    <circle cx="130" cy="200" r="7" />
    <circle cx="150" cy="150" r="7" />
  </g>

  <!-- Center Hub with Layered Rings -->
  <circle cx="200" cy="200" r="42" fill="url(#nssBlueGrad)" stroke="#ffe082" stroke-width="4" filter="url(#shadow)" />
  <circle cx="200" cy="200" r="28" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2" />
  <circle cx="200" cy="200" r="14" fill="#0a2558" />
  <circle cx="200" cy="200" r="5" fill="#ffffff" />
</svg>
