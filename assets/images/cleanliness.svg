<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cleanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#cleanGrad)" />
  <circle cx="500" cy="80" r="120" fill="#ffffff" opacity="0.08" />
  <circle cx="100" cy="320" r="100" fill="#38bdf8" opacity="0.1" />
  <!-- Broom &amp; Sparkles Graphic -->
  <g transform="translate(300, 180) scale(1.1)">
    <!-- Dustbin / Recycling Icon -->
    <rect x="-40" y="-10" width="80" height="90" rx="8" fill="#ffffff" opacity="0.9" />
    <rect x="-46" y="-22" width="92" height="12" rx="4" fill="#38bdf8" />
    <rect x="-15" y="-30" width="30" height="8" rx="2" fill="#38bdf8" />
    <!-- Recycle Symbol -->
    <path d="M -15,20 L 0,5 L 15,20 M 15,35 L 0,50 L -15,35" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    <!-- Sparkles -->
    <circle cx="70" cy="-40" r="6" fill="#facc15" />
    <path d="M 60,-50 L 80,-50 M 70,-60 L 70,-40" fill="none" stroke="#facc15" stroke-width="3" stroke-linecap="round" />
    <circle cx="-70" cy="-20" r="4" fill="#ffffff" />
    <path d="M -75,-25 L -65,-25 M -70,-30 L -70,-20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  </g>
  <text x="300" y="325" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Swachh Bharat &amp; Cleanliness</text>
  <text x="300" y="355" fill="#bae6fd" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">MNIT Campus &amp; Adopted Slum Drives</text>
</svg>
