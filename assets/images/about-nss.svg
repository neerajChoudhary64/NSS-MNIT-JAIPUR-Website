<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAbout" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c" />
      <stop offset="50%" stop-color="#143c7d" />
      <stop offset="100%" stop-color="#071739" />
    </linearGradient>
    <linearGradient id="saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933" />
      <stop offset="100%" stop-color="#e65100" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ec4b6" />
      <stop offset="100%" stop-color="#008037" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" rx="24" fill="url(#bgAbout)" />

  <!-- Geometric Decorative Elements -->
  <circle cx="700" cy="100" r="180" fill="#ffffff" opacity="0.03" />
  <circle cx="100" cy="500" r="140" fill="#ff9933" opacity="0.05" />
  <path d="M 0,450 Q 200,380 400,460 T 800,420 L 800,600 L 0,600 Z" fill="#06122b" opacity="0.6" />

  <!-- Konark Wheel Watermark in Background -->
  <g transform="translate(400, 260) scale(0.9)" opacity="0.15">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#ffffff" stroke-width="6" />
    <circle cx="0" cy="0" r="130" fill="none" stroke="#ff9933" stroke-width="3" stroke-dasharray="8,8" />
    <circle cx="0" cy="0" r="40" fill="#ffffff" />
    <!-- Spokes -->
    <line x1="0" y1="-150" x2="0" y2="150" stroke="#ffffff" stroke-width="8" />
    <line x1="-150" y1="0" x2="150" y2="0" stroke="#ffffff" stroke-width="8" />
    <line x1="-106" y1="-106" x2="106" y2="106" stroke="#ffffff" stroke-width="8" />
    <line x1="-106" y1="106" x2="106" y2="-106" stroke="#ffffff" stroke-width="8" />
  </g>

  <!-- Central Volunteers Silhouette & Action Scene -->
  <!-- Hands forming supportive circle / youth empowerment -->
  <g transform="translate(400, 280)">
    <!-- Tree / Life Symbol -->
    <path d="M 0,-40 C -30,-120 30,-120 0,-40 Z" fill="url(#greenGrad)" />
    <circle cx="-35" cy="-75" r="38" fill="url(#greenGrad)" opacity="0.9" />
    <circle cx="35" cy="-75" r="38" fill="url(#greenGrad)" opacity="0.9" />
    <circle cx="0" cy="-105" r="45" fill="#38b000" />
    
    <!-- Tree Trunk / Upward Hands -->
    <path d="M -8,-35 L -8,45 L 8,45 L 8,-35 Z" fill="#b07d62" />

    <!-- Group of diverse youth volunteers -->
    <!-- Volunteer 1 (Left) -->
    <circle cx="-130" cy="30" r="26" fill="#ffe0b2" />
    <path d="M -165,130 C -165,75 -100,75 -95,130 Z" fill="#1e88e5" />
    <!-- Volunteer 2 (Center Left) -->
    <circle cx="-65" cy="10" r="28" fill="#ffccbc" />
    <path d="M -105,120 C -105,60 -25,60 -25,120 Z" fill="url(#saffron)" />
    <!-- Volunteer 3 (Center Right) -->
    <circle cx="65" cy="10" r="28" fill="#ffe082" />
    <path d="M 25,120 C 25,60 105,60 105,120 Z" fill="#00897b" />
    <!-- Volunteer 4 (Right) -->
    <circle cx="130" cy="30" r="26" fill="#ffccbc" />
    <path d="M 95,130 C 95,75 165,75 165,130 Z" fill="#fb8c00" />

    <!-- Supportive Hands Arcs -->
    <path d="M -180,90 Q 0,180 180,90" fill="none" stroke="#ffe082" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Floating Cards / Badges -->
  <g transform="translate(60, 80)">
    <rect width="180" height="70" rx="14" fill="#ffffff" opacity="0.95" />
    <circle cx="38" cy="35" r="20" fill="#e3f2fd" />
    <text x="38" y="42" font-family="'Poppins', sans-serif" font-size="20" text-anchor="middle" fill="#1565c0">🤝</text>
    <text x="70" y="30" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#0f2b5c">NOT ME</text>
    <text x="70" y="48" font-family="'Poppins', sans-serif" font-size="12" font-weight="600" fill="#e65100">BUT YOU</text>
  </g>

  <g transform="translate(560, 440)">
    <rect width="180" height="70" rx="14" fill="#ffffff" opacity="0.95" />
    <circle cx="38" cy="35" r="20" fill="#e8f5e9" />
    <text x="38" y="42" font-family="'Poppins', sans-serif" font-size="20" text-anchor="middle" fill="#2e7d32">🌱</text>
    <text x="70" y="30" font-family="'Poppins', sans-serif" font-size="13" font-weight="700" fill="#0f2b5c">MNIT JAIPUR</text>
    <text x="70" y="48" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#2e7d32">Youth for Nation</text>
  </g>
</svg>