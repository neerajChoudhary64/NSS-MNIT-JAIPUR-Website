<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#bloodGrad)" />
  <circle cx="80" cy="80" r="100" fill="#ffffff" opacity="0.05" />
  <g transform="translate(300, 170) scale(1.15)">
    <!-- Blood Drop with Heart -->
    <path d="M 0,-70 C -35,-20 -55,10 -55,40 C -55,75 -25,95 0,95 C 25,95 55,75 55,40 C 55,10 35,-20 0,-70 Z" fill="#ef4444" stroke="#ffffff" stroke-width="4" />
    <path d="M 0,25 C -15,10 -30,22 -30,35 C -30,50 0,68 0,68 C 0,68 30,50 30,35 C 30,22 15,10 0,25 Z" fill="#ffffff" />
    <!-- Pulse Line -->
    <path d="M -90,45 L -65,45 L -55,25 L -45,65 L -35,35 L -25,45 L -15,45" fill="none" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 15,45 L 25,45 L 35,35 L 45,65 L 55,25 L 65,45 L 90,45" fill="none" stroke="#fca5a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="300" y="325" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Mega Blood Donation Camps</text>
  <text x="300" y="355" fill="#fecaca" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">Annual Camp at SAC • Saving Lives Together</text>
</svg>