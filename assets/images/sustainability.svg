<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="sustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#sustGrad)" />
  <circle cx="480" cy="100" r="120" fill="#ffffff" opacity="0.06" />
  <g transform="translate(300, 175) scale(1.15)">
    <!-- Globe with leaves -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#6ee7b7" stroke-width="4" />
    <path d="M -50,0 Q 0,-30 50,0 Q 0,30 -50,0" fill="none" stroke="#6ee7b7" stroke-width="2" />
    <path d="M 0,-50 Q -30,0 0,50 Q 30,0 0,-50" fill="none" stroke="#6ee7b7" stroke-width="2" />
    <!-- Leaf sprouting over globe -->
    <path d="M 0,-40 C 25,-75 60,-50 30,-30 C 15,-20 0,-40 0,-40 Z" fill="#a7f3d0" />
    <path d="M 0,-40 C -25,-75 -60,-50 -30,-30 C -15,-20 0,-40 0,-40 Z" fill="#34d399" />
  </g>
  <text x="300" y="325" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Mission LiFE &amp; Sustainability</text>
  <text x="300" y="355" fill="#a7f3d0" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">Eco-Friendly Campus • Solar &amp; Water Conservation</text>
</svg>
