<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="100%" stop-color="#14532d" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#plantGrad)" />
  <circle cx="520" cy="90" r="130" fill="#ffffff" opacity="0.05" />
  <g transform="translate(300, 175) scale(1.15)">
    <!-- Soil / Hands -->
    <path d="M -70,50 Q 0,85 70,50 Q 0,65 -70,50 Z" fill="#b45309" />
    <!-- Sprout / Sapling -->
    <path d="M 0,55 Q -10,15 0,-25 Q 10,15 0,55 Z" fill="#84cc16" />
    <path d="M 0,15 Q -40,-10 -25,-45 Q -5,-15 0,15 Z" fill="#22c55e" />
    <path d="M 0,5 Q 40,-20 25,-55 Q 5,-25 0,5 Z" fill="#4ade80" />
    <circle cx="0" cy="-60" r="14" fill="#a3e635" />
    <!-- Water drop -->
    <path d="M 45,-15 C 45,-5 55,0 55,10 C 55,16 50,20 45,20 C 40,20 35,16 35,10 C 35,0 45,-5 45,-15 Z" fill="#38bdf8" />
  </g>
  <text x="300" y="325" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Mass Plantation Drives</text>
  <text x="300" y="355" fill="#bbf7d0" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">Green MNIT • Mission LiFE Tree Census</text>
</svg>