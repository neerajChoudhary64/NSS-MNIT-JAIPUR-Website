<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="commGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#commGrad)" />
  <circle cx="120" cy="100" r="120" fill="#ffffff" opacity="0.06" />
  <g transform="translate(300, 175) scale(1.15)">
    <!-- Hands holding community / house -->
    <path d="M -35,15 L 0,-15 L 35,15 L 35,45 L -35,45 Z" fill="#ffffff" />
    <path d="M -42,16 L 0,-22 L 42,16" fill="none" stroke="#fef3c7" stroke-width="4" stroke-linecap="round" />
    <!-- Heart over house -->
    <circle cx="0" cy="10" r="8" fill="#ef4444" />
    <!-- Two people standing -->
    <circle cx="-55" cy="5" r="10" fill="#fef3c7" />
    <path d="M -65,40 C -65,22 -45,22 -45,40 Z" fill="#fef3c7" />
    <circle cx="55" cy="5" r="10" fill="#fef3c7" />
    <path d="M 45,40 C 45,22 65,22 65,40 Z" fill="#fef3c7" />
  </g>
  <text x="300" y="325" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="22" font-weight="700" text-anchor="middle">Community Development</text>
  <text x="300" y="355" fill="#fde68a" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">Village Adoption &amp; Cloth Donation Drives</text>
</svg>
